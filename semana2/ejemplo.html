<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ingreso UTPL</title>
	<link rel="stylesheet" type="text/css" href="css/estilos2.css">
</head>
<body>
	<header class="cabeceraPrincipal">
		<h1>Logo</h1>
		<nav>
			<a href="#">Link 1</a>
			<a href="#">Link 2</a>
			<a href="#">Link 3</a>
		</nav>
	</header>

	<main id="principal">
		<h2>Main</h2>
		<section>
			<h2>Section</h2>
			<article>
				<h2>Article</h2>
				<h3>FORMULARIO</h3>
				<form action="#" method="post">
					<label for="user">Usuario:</label>
					<input type="email" id="user" name="user" placeholder="Ingrese su correo" required>

					<label for="clave">Clave:</label>
					<input type="password" id="clave" name="clave" placeholder="Ingrese su clave" required>

					<button type="submit">Ingresar</button>
				</form>
			</article>
		</section>
	</main>

	<footer>
		<h6>DERECHOS RESERVADOS UTPL</h6>
	</footer>
</body>
</html>
